[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-bench"
version = "1.2.1"
description = "Leakage-free, cross-domain uplift/CATE benchmarking study"
readme = "README.md"
license = { file = "LICENSE" }
# Tested on CPython 3.12.13 (the exact interpreter used for the paper); 3.11 is supported.
# Upper-bounded <3.13 because the pinned numpy<2 / scientific stack is not validated on 3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "lightgbm>=4.3,<5.0",
    "xgboost>=2.0,<3.0",
    "econml>=0.15,<1.0",
    "causalml>=0.15,<1.0",
    "scikit-uplift>=0.5,<1.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "scipy>=1.12,<2.0",
    "pyarrow>=15.0,<19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# The analysis scripts under scripts/ produce every reported number, so they ARE linted
# (a merge-collision bug once shipped because they were not). Two rules are relaxed
# there: long lines are mostly LaTeX/format strings that read worse when wrapped, and
# `x = y; z = w` pairs are deliberate in short numeric setup blocks.
[tool.ruff.lint.per-file-ignores]
# F841: unused locals are mostly matplotlib handles kept for readability
"scripts/*.py" = ["E501", "E702", "F841"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not network'"
markers = [
    "network: tests that require network/downloaded data (deselect with -m 'not network')",
]
