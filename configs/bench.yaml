defaults:
  - _self_
  - dataset: synthetic
  - model: t_learner

seed: 42
n_folds: 3
n_seeds: 3
smoke: false
bench_n: null             # null = no cap; set to e.g. 50000 for large datasets

results_dir: results/
data_dir: data/

tuning:
  enabled: true
  objective: qini
  n_samples: 10           # reduced vs. full (20) for tractability
  inner_folds: 2

metrics:
  budget_k: 0.3

hydra:
  job:
    chdir: false
